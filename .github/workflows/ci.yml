name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    name: Template app — analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Verify generated code is up to date
        # git add + diff --cached also catches NEW generated files that a
        # contributor forgot to commit (plain git diff is blind to them).
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git add -A lib
          git diff --cached --exit-code -- lib
      - run: dart format --set-exit-if-changed lib test
      - name: Addon sources are format-clean too
        # template_addons/ ships verbatim into generated apps, and the CI
        # workflow those apps receive suggests a format gate — so
        # unformatted addon code would become the user's red build.
        working-directory: .
        run: dart format --set-exit-if-changed template_addons
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Coverage floor
        # `--coverage` used to write lcov.info and nothing ever read it.
        # Publish the number to the job summary so it is visible on the PR
        # without downloading anything, and fail below the floor.
        env:
          # A ratchet, not a target. Measured 78.49% (613/781 lines) on the
          # 1.2.0 tree; the floor sits a few points under so an ordinary PR
          # does not go red on a one-point dip, while a deleted test file or
          # a large untested module still trips it. Raise it as coverage
          # rises; never lower it to make CI green.
          FLOOR: '72'
        run: |
          pct=$(awk -F: '/^LF:/ { f += $2 } /^LH:/ { h += $2 }
                         END { printf "%.2f", f ? 100 * h / f : 0 }' \
                coverage/lcov.info)
          echo "Template line coverage: ${pct}% (floor ${FLOOR}%)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v pct="$pct" -v floor="$FLOOR" 'BEGIN {
            if (pct < floor) {
              print "::error::Template coverage " pct "% < floor " floor "%"
              exit 1
            }
          }'
      - uses: actions/upload-artifact@v7
        with:
          name: template-coverage
          # Job-level working-directory does not apply to `uses:` steps.
          path: template/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  cli:
    name: CLI — analyze & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/fluframe
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --set-exit-if-changed lib test tool
      - run: dart analyze
      - run: dart test -x e2e --coverage=coverage
      - name: Convert coverage to lcov
        # `coverage` is activated rather than added as a dev_dependency:
        # format_coverage is a CI-only tool and the CLI's dependency list is
        # part of what users audit before installing it. Pinned to a major
        # so an upstream release cannot change the flags under us.
        run: |
          dart pub global activate coverage '^1.15.0'
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
      - name: Coverage floor
        # The floor is computed from the emitted lcov, NOT from
        # format_coverage's own --fail-under: that flag scores the whole
        # collected hitmap (SDK and pub dependencies included, 10.7% here)
        # instead of the --report-on=lib subset, so it gates on a number
        # nobody is looking at.
        env:
          # A ratchet, not a target. Measured 77-79% while hardening 1.1.0
          # (552/715 lines at the low end), so this sits a few points under
          # the trough — enough slack for the OS-conditional branches only
          # one runner takes, tight enough to catch a deleted test file or
          # a large untested module. Raise it as coverage rises; never
          # lower it to make CI green.
          FLOOR: '70'
        run: |
          pct=$(awk -F: '/^LF:/ { f += $2 } /^LH:/ { h += $2 }
                         END { printf "%.2f", f ? 100 * h / f : 0 }' \
                coverage/lcov.info)
          echo "CLI line coverage: ${pct}% (floor ${FLOOR}%)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v pct="$pct" -v floor="$FLOOR" 'BEGIN {
            if (pct < floor) {
              print "::error::CLI coverage " pct "% < floor " floor "%"
              exit 1
            }
          }'
      - uses: actions/upload-artifact@v7
        with:
          name: cli-coverage
          # Job-level working-directory does not apply to `uses:` steps.
          path: packages/fluframe/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  cli-cross-platform:
    # The CLI shells out to flutter/dart/git and feeds their output back
    # into user source files, so encoding and path behaviour must be
    # verified off Linux too. Kept as a separate job (not a matrix on
    # `cli`) because that job's name is a required status check.
    name: CLI — unit tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/fluframe
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart test -x e2e

  e2e:
    name: CLI — end-to-end (generate & verify app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/fluframe
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart test -t e2e --reporter expanded

  e2e-cross-platform:
    # `fluframe create` is a Windows-first pain point (symlinks, cmd.exe
    # exit codes, path separators) and the release gate never ran there.
    # Separate job, not a matrix on `e2e`: that job's name is a required
    # status check.
    name: CLI — end-to-end on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/fluframe
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart test -t e2e --reporter expanded

  example-drift:
    # The examples job proves the examples COMPILE. It never noticed that
    # both had lost core/logging/error_handlers.dart — the file the
    # template calls its crash-reporting seam — while docs claimed the
    # matrix meant they "cannot rot". This is the check that meant it.
    name: Examples — no drift from the template
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/fluframe
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart run tool/check_example_drift.dart

  examples:
    name: Example apps — analyze & test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [todo_app, weather_app]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
