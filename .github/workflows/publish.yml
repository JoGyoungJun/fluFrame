name: Publish to pub.dev

# Automated publishing via OIDC (dart.dev/tools/pub/automated-publishing).
# pub.dev only accepts publishes from workflows triggered by a tag push
# matching the pattern configured in the package's admin settings
# (fluframe-v{{version}}). Every release gate runs BEFORE publishing —
# a red gate means the tag exists but nothing was published (fix, delete
# the tag, re-tag). The first gate is CI's own conclusion for the tagged
# commit (`verify-ci`); the rest run in the publish job itself.

on:
  push:
    tags:
      - 'fluframe-v[0-9]+.[0-9]+.[0-9]+'

# Least privilege by default; the publish job adds only the OIDC scope.
permissions:
  contents: read

jobs:
  verify-ci:
    # The gates in the publish job below run on ubuntu-latest, and always
    # have. ci.yml's `cli-cross-platform` and `e2e-cross-platform` jobs —
    # the Windows and macOS halves of a CLI whose own CI comment calls
    # `fluframe create` "a Windows-first pain point" — therefore ran
    # NOWHERE before the upload. A tag pushed on a commit with a red
    # Windows e2e published to pub.dev anyway, and pub.dev only offers a
    # seven-day retraction window against a bundle that ADR 0002 makes the
    # permanent merge base for every app generated from that version.
    #
    # Requiring CI's own conclusion, rather than copying the two matrix
    # jobs into this workflow, is the deliberate choice: the run
    # conclusion covers every CI job (template analyze/test, both coverage
    # floors, examples, example-drift, generated-android, web-build), not
    # just the two that motivated this; it cannot drift from ci.yml the
    # way a copied job would; and it costs seconds instead of a second
    # Windows + macOS Flutter install on every release. The trade is that
    # this gate reads a result instead of producing one — which is why it
    # insists on a `push`-event run. A push run checks out exactly the
    # commit being tagged, while a `pull_request` run tests that commit
    # merged into main and reports the PR head as its head_sha, so it
    # cannot vouch for this tree. ci.yml pushes only on main, so this also
    # refuses to publish a commit that never landed there.
    #
    # It is the whole run's conclusion, so `deploy-demo` counts too: a
    # failed Pages deploy on the release commit blocks the publish. That
    # is the deliberate reading rather than an oversight — an exception
    # list here would be a second copy of the repository ruleset's
    # required checks, free to drift from it, while the recovery is cheap
    # (re-run the failed job, then re-tag).
    #
    # It runs as its own job rather than as a first step of `publish` so
    # that `actions: read` is scoped away from the job holding the OIDC
    # publish credential, and so a red CI stops the release before the
    # toolchain is even installed.
    name: Verify CI is green for this commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read this repository's workflow runs; nothing more
    steps:
      # No checkout: this step only queries the API about github.sha.
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tagging straight after a merge is the normal release flow, so
          # CI is usually still running when this starts. Wait for it
          # instead of failing on a race the maintainer cannot see; the
          # ceiling clears a cold-cache `generated-android` (CI's longest
          # job) with room to spare. Past it, the tag carries no release
          # and re-tagging retries — the documented recoverable state.
          POLL_SECONDS: '20'
          TIMEOUT_MINUTES: '30'
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))
          while true; do
            # Sorted here rather than trusting the server's order: a
            # re-run keeps its run id, but a re-pushed branch can leave
            # more than one run on the same head_sha, and only the newest
            # describes what is about to be published.
            run=$(gh api --method GET \
                    "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
                    -f head_sha="$GITHUB_SHA" -f event=push -f per_page=20 \
                    --jq '.workflow_runs | sort_by(.created_at) | .[-1] // empty
                          | "\(.status) \(.conclusion) \(.html_url)"' || true)
            if [ -n "$run" ]; then
              read -r status conclusion url <<< "$run"
              if [ "$status" = 'completed' ]; then
                break
              fi
              echo "CI run $url is '$status' — waiting ${POLL_SECONDS}s."
            else
              echo "No push-event CI run for $GITHUB_SHA yet — waiting ${POLL_SECONDS}s."
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::No completed CI run for $GITHUB_SHA after ${TIMEOUT_MINUTES}m. Nothing was published. Re-tagging alone does not help: ci.yml runs on push and pull_request only, so a tag creates no new run. Get CI to run and conclude success for this exact commit, then delete and re-push the tag."
              exit 1
            fi
            sleep "$POLL_SECONDS"
          done
          echo "CI for $GITHUB_SHA concluded '$conclusion': $url" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$conclusion" != 'success' ]; then
            # 'cancelled' needs a different remedy from 'failure', and the
            # generic one is actively wrong for it: ci.yml has no tag
            # trigger, so deleting and re-pushing the tag re-reads this very
            # run and fails identically. The run must be re-run in place.
            if [ "$conclusion" = 'cancelled' ]; then
              echo "::error::CI was cancelled for the tagged commit. Nothing was published. Re-tagging cannot clear this — ci.yml has no tag trigger, so it would re-read this same cancelled run. Re-run it in place (gh run rerun, at $url), wait for success, then delete and re-push the tag."
            else
              echo "::error::CI concluded '$conclusion' for the tagged commit ($url). Nothing was published: fix CI on main, then delete and re-push the tag."
            fi
            exit 1
          fi

  publish:
    name: Gate & publish fluframe
    # Every gate precedes the upload, and this is now the first of them.
    needs: verify-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token exchange for pub.dev
    defaults:
      run:
        working-directory: packages/fluframe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-dart FIRST, flutter-action second — the order is the
      # point, not an accident of editing. Both actions prepend their
      # own bin directory to PATH, so whichever runs LAST owns the bare
      # `dart` every gate step below calls. With setup-dart last, this
      # workflow ran `dart pub get`, `dart test` and `dart test -t e2e`
      # under the standalone SDK — while ci.yml's `e2e` job runs those
      # same three commands under Flutter's bundled Dart, and no job in
      # ci.yml installs both actions. The last gate before an
      # irreversible pub.dev upload was therefore the only place that
      # pairing was ever exercised, and a green CI said nothing about
      # it. Flipping the two makes the release gate run the toolchain
      # CI actually proved.
      #
      # setup-dart stays whatever the order: it is what mints the
      # pub.dev credential from the GitHub OIDC token. That exchange
      # runs in the action's own Node process against the runner's
      # ACTIONS_ID_TOKEN_REQUEST_* variables and leaves the result as
      # job state — an environment variable, and the user-level pub
      # credentials file, which has lived outside PUB_CACHE since Dart
      # 2.15 and is read by whichever SDK runs. None of that is
      # PATH-dependent, and the credential already has to survive the
      # several minutes of tests between here and the publish step, so
      # moving this action earlier does not change what it must
      # outlive. The step below records whether it survived.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Record the toolchain this release was gated on
        # Which `dart` answers is decided by PATH order, which is
        # invisible in a run log — and this is a release record, so it
        # is worth a few lines. If a future publish fails on an SDK
        # version or on a missing credential, this block says which SDK
        # ran the gates and whether a pub.dev credential was ever
        # configured. It reports presence only, never the token, and
        # never fails the job: a diagnostic that can block a release is
        # a diagnostic with a bug.
        #
        # Three details earn their lines here because this workflow is
        # tag-triggered only and cannot be rehearsed — the action order
        # above changed after the last tag, so the next run is the first
        # run. `type -a` lists BOTH installed SDKs in resolution order
        # instead of only the winner, since the whole question is which
        # of the two owns `dart`; the `Tools • Dart` line gives Flutter's
        # bundled version, so the winner is identifiable by version and
        # not just by an opaque hostedtoolcache path; and tee puts all of
        # it in the run log as well as the job summary, because when a
        # later step fails the log is what gets read.
        run: |
          {
            echo '```'
            echo 'dart on PATH (first wins):'
            type -a dart 2>&1 || true
            dart --version 2>&1
            flutter --version 2>&1 | grep -E '^(Flutter|Tools)' || true
            if [ -n "${PUB_TOKEN:-}" ]; then
              echo 'pub.dev credential: PUB_TOKEN is set'
            elif dart pub token list 2>/dev/null | grep -q 'pub.dev'; then
              echo 'pub.dev credential: configured for pub.dev'
            else
              echo 'pub.dev credential: none visible at this point'
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Verify tag matches pubspec version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#fluframe-v}"
          PUB_VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          echo "tag=$TAG_VERSION pubspec=$PUB_VERSION"
          test "$TAG_VERSION" = "$PUB_VERSION"
      - name: Take the publishing credential out of the gates
        # `setup-dart` runs `dart pub token add https://pub.dev --env-var
        # PUB_TOKEN` as soon as it installs, so from that point every pub
        # request — including ordinary dependency downloads — is sent
        # authenticated with the temporary OIDC *publishing* token. On
        # 2026-09-11 pub.dev began rejecting those reads: `dart pub get`
        # died with "Because fluframe depends on very_good_analysis any
        # which doesn't exist (authorization failed) / Insufficient
        # permissions", twice, on a tag whose only difference from the
        # 1.8.0 release that published fine was its version number. An
        # anonymous `dart pub get` on the same pubspec resolved that same
        # dependency without complaint, which at the time looked like it
        # placed the failure in the credential.
        #
        # CORRECTION (2026-09-14): it does not. PR #18's `CLI — analyze &
        # unit tests` job hit the identical error at `dart pub get` 73
        # minutes EARLIER the same morning, and that job has no id-token,
        # no PUB_TOKEN and no pub credential at all. A registry-side
        # incident covers every observation; the credential covers one.
        # Keep this step — a publishing token has no business being live
        # while the gates resolve and run third-party code — but keep it
        # as least-privilege hygiene, not as a fix for that incident.
        #
        # The credential is therefore removed here and re-added
        # immediately before the publish step. That is not a workaround
        # so much as the arrangement this should always have had: a
        # publishing credential has no business authenticating a
        # dependency download, and the narrower window is worth having
        # whatever pub.dev does next. `--env-var` stores only a REFERENCE
        # to $PUB_TOKEN, which stays in the job environment throughout, so
        # re-adding it is a one-line local edit and needs no second OIDC
        # exchange.
        run: dart pub token remove https://pub.dev || true
      - run: dart pub get
      - name: Unit tests (includes the cliVersion sync guard)
        run: dart test -x e2e
      - name: Sync template bundle
        run: dart run tool/sync_template.dart
      - name: E2E (generate from the bundle, analyze + test)
        run: dart test -t e2e --reporter expanded
      - name: Publish dry-run
        run: dart pub publish --dry-run
      - name: Restore the publishing credential
        # Re-points pub at $PUB_TOKEN for the one step that needs it. The
        # gates above have all passed by now, so this is the last thing
        # between a green run and an upload that can never be taken back.
        #
        # The dry-run above is deliberately left anonymous: the known
        # failure mode is "publishing token + package read = 403", and a
        # dry-run re-validates the package. Verified rather than assumed,
        # because a restore that silently did nothing would surface as an
        # auth failure during the upload instead of before it.
        run: |
          dart pub token add https://pub.dev --env-var PUB_TOKEN
          dart pub token list | grep -q 'pub.dev'
      - name: Publish
        run: dart pub publish --force
