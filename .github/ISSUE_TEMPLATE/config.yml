blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/JoGyoungJun/fluFrame/security/advisories/new
    about: >-
      Private, between you and the maintainer until an advisory is
      published. Details of a security problem never belong in a public
      issue — the only exception is the detail-free nudge SECURITY.md
      describes for a report that went unacknowledged.
  - name: Security policy
    url: https://github.com/JoGyoungJun/fluFrame/blob/main/SECURITY.md
    about: >-
      What is in scope, what a useful report contains, and the response
      windows you can hold the maintainer to.
