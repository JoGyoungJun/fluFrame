name: Feature request
description: Propose an addition or change to the template or the CLI
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Template app (template/)
        - fluframe CLI
        - Docs / repository
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What need or pain does this address? Who hits it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This keeps the template dependency-light (new dependencies need strong justification)
